<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jarvis Dashboard</title>
<style>
  :root {
    --bg:       #0d0f14;
    --card:     #151820;
    --card2:    #1a1e28;
    --border:   #252a38;
    --accent:   #4f8ef7;
    --green:    #22c55e;
    --red:      #ef4444;
    --yellow:   #f59e0b;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --radius:   10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

  /* ── Login ── */
  #login-page {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: linear-gradient(135deg, #0d0f14 0%, #151820 100%);
  }
  .login-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 48px 40px; width: 360px; text-align: center;
  }
  .login-box .logo { font-size: 32px; font-weight: 800; letter-spacing: 4px; color: var(--accent); margin-bottom: 6px; }
  .login-box .sub  { color: var(--muted); margin-bottom: 32px; font-size: 13px; }
  .login-box input {
    width: 100%; padding: 12px 16px; margin-bottom: 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 14px; outline: none; transition: border .2s;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    width: 100%; padding: 13px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity .2s;
  }
  .login-box button:hover { opacity: .88; }
  .login-error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* ── Main App ── */
  #app { display: none; }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between;
  }
  header .brand { font-size: 20px; font-weight: 800; letter-spacing: 3px; color: var(--accent); }
  header .meta  { display: flex; align-items: center; gap: 16px; }
  header .refresh-btn {
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    transition: background .2s;
  }
  header .refresh-btn:hover { background: var(--border); }
  header .logout-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  #last-update { color: var(--muted); font-size: 12px; }

  main { padding: 24px; max-width: 1600px; margin: 0 auto; }

  /* ── Period Filter ── */
  .period-bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; margin-bottom: 24px;
  }
  .period-bar label { color: var(--muted); font-size: 12px; margin-right: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .period-btn {
    background: var(--card2); border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
    transition: all .15s;
  }
  .period-btn.active, .period-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── PnL Summary ── */
  .pnl-summary {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;
  }
  .pnl-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px;
  }
  .pnl-card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .pnl-card .value { font-size: 22px; font-weight: 700; }
  .pnl-card .sub   { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neu { color: var(--text); }

  /* ── Account Grid ── */
  .accounts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 1200px) { .accounts-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 768px)  { .accounts-grid { grid-template-columns: 1fr; } .pnl-summary { grid-template-columns: 1fr 1fr; } }

  .account-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .account-header {
    background: var(--card2); padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .account-header .name  { font-weight: 700; font-size: 15px; }
  .account-header .badge {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: rgba(79,142,247,.15); color: var(--accent); border: 1px solid rgba(79,142,247,.3);
  }

  .account-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .stat-cell {
    padding: 14px 16px; border-right: 1px solid var(--border);
    text-align: center;
  }
  .stat-cell:last-child { border-right: none; }
  .stat-cell .s-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  .stat-cell .s-value { font-size: 16px; font-weight: 700; }

  .section-title {
    padding: 10px 18px; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 1px;
    background: var(--card2); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between;
  }
  .section-title .count {
    background: var(--border); color: var(--text);
    padding: 1px 7px; border-radius: 10px; font-size: 11px;
  }

  .trades-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .trades-table th {
    padding: 8px 14px; text-align: left; color: var(--muted);
    border-bottom: 1px solid var(--border); font-weight: 500;
  }
  .trades-table td { padding: 8px 14px; border-bottom: 1px solid var(--border); }
  .trades-table tr:last-child td { border-bottom: none; }
  .trades-table tr:hover td { background: rgba(255,255,255,.02); }

  .side-long  { color: var(--green); font-weight: 600; }
  .side-short { color: var(--red);   font-weight: 600; }
  .empty-row  { padding: 14px 18px; color: var(--muted); font-size: 12px; font-style: italic; }

  .account-pnl-row {
    padding: 12px 18px; display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--border); font-size: 12px;
  }
  .account-pnl-row .pl { font-weight: 700; font-size: 14px; }

  .error-banner {
    background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
    color: var(--red); padding: 10px 18px; font-size: 12px;
  }

  .spinner {
    display: inline-block; width: 14px; height: 14px; margin-left: 8px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(13,15,20,.85);
    display: flex; align-items: center; justify-content: center; z-index: 999;
    flex-direction: column; gap: 16px; font-size: 15px; color: var(--muted);
  }
  .loading-overlay .big-spin {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
  }
</style>
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────────────────── -->
<div id="login-page">
  <div class="login-box">
    <div class="logo">JARVIS</div>
    <div class="sub">Delta Trading Dashboard</div>
    <input type="text"     id="username" placeholder="Username" autocomplete="off"/>
    <input type="password" id="password" placeholder="Password"/>
    <button onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── App ───────────────────────────────────────────────────────────────── -->
<div id="app">
  <header>
    <div class="brand">JARVIS</div>
    <div class="meta">
      <span id="last-update">–</span>
      <button class="refresh-btn" onclick="loadAll()">⟳ Refresh</button>
      <button class="logout-btn"  onclick="doLogout()">Logout</button>
    </div>
  </header>
  <main>

    <!-- Period filter -->
    <div class="period-bar">
      <label>PnL Period:</label>
      <button class="period-btn active" data-p="today">Today</button>
      <button class="period-btn" data-p="yesterday">Yesterday</button>
      <button class="period-btn" data-p="7d">Last 7 Days</button>
      <button class="period-btn" data-p="this_week">This Week</button>
      <button class="period-btn" data-p="last_week">Last Week</button>
      <button class="period-btn" data-p="this_month">This Month</button>
      <button class="period-btn" data-p="last_month">Last Month</button>
      <button class="period-btn" data-p="3m">Last 3 Months</button>
      <button class="period-btn" data-p="all">All Time</button>
    </div>

    <!-- PnL Summary -->
    <div class="pnl-summary" id="pnl-summary">
      <div class="pnl-card"><div class="label">Total Capital</div><div class="value neu" id="sum-capital">–</div><div class="sub">All accounts combined</div></div>
      <div class="pnl-card"><div class="label">Total Unrealized PnL</div><div class="value" id="sum-unrealized">–</div><div class="sub">Open positions</div></div>
      <div class="pnl-card"><div class="label">Period Realized PnL</div><div class="value" id="sum-realized">–</div><div class="sub" id="period-label">Today</div></div>
      <div class="pnl-card"><div class="label">Open Trades</div><div class="value neu" id="sum-trades">–</div><div class="sub">Active positions</div></div>
    </div>

    <!-- Account Cards -->
    <div class="accounts-grid" id="accounts-grid">
      <div style="color:var(--muted);padding:40px;text-align:center;grid-column:span 3">Loading accounts…</div>
    </div>

  </main>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loading" style="display:none">
  <div class="big-spin"></div>
  <span>Fetching live data…</span>
</div>

<script>
let token = localStorage.getItem('jarvis_token');
let currentPeriod = 'today';
let accountsData  = [];
let refreshTimer  = null;

// ── Auth ─────────────────────────────────────────────────────────────────────

async function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  document.getElementById('login-error').textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Login failed');
    token = d.token;
    localStorage.setItem('jarvis_token', token);
    showApp();
  } catch(e) {
    document.getElementById('login-error').textContent = e.message;
  }
}

function doLogout() {
  localStorage.removeItem('jarvis_token');
  token = null;
  clearInterval(refreshTimer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-page').style.display = 'flex';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-page').style.display !== 'none') doLogin();
});

function showApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAll();
  clearInterval(refreshTimer);
  refreshTimer = setInterval(loadAll, 60000);
}

if (token) showApp();

// ── Period buttons ────────────────────────────────────────────────────────────

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.p;
    loadPnl();
  });
});

// ── API calls ─────────────────────────────────────────────────────────────────

function authHeaders() {
  return { Authorization: `Bearer ${token}` };
}

async function loadAll() {
  await Promise.all([loadAccounts(), loadPnl()]);
}

async function loadAccounts() {
  setLoading(true);
  try {
    const r = await fetch('/api/accounts', { headers: authHeaders() });
    if (r.status === 401) { doLogout(); return; }
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    accountsData = d.accounts;
    renderAccounts(accountsData);
    updateSummaryCapital(accountsData);
    document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    console.error(e);
  } finally {
    setLoading(false);
  }
}

async function loadPnl() {
  try {
    const r = await fetch(`/api/pnl?period=${currentPeriod}`, { headers: authHeaders() });
    if (r.status === 401) { doLogout(); return; }
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    updatePnlSummary(d);
    updateAccountPnl(d.accounts);
  } catch(e) {
    console.error(e);
  }
}

// ── Render ────────────────────────────────────────────────────────────────────

function fmt(n, dec = 2) {
  if (n === null || n === undefined || isNaN(n)) return '–';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function pnlClass(n) { return n > 0 ? 'pos' : n < 0 ? 'neg' : 'neu'; }
function pnlSign(n)  { return n > 0 ? '+' : ''; }

function updateSummaryCapital(accounts) {
  const totalBal  = accounts.reduce((s, a) => s + (a.balance || 0), 0);
  const totalUnrl = accounts.reduce((s, a) => s + (a.unrealizedPnl || 0), 0);
  const totalPos  = accounts.reduce((s, a) => s + (a.positions?.length || 0), 0);
  document.getElementById('sum-capital').textContent    = '$' + fmt(totalBal);
  document.getElementById('sum-unrealized').textContent = pnlSign(totalUnrl) + '$' + fmt(totalUnrl);
  document.getElementById('sum-unrealized').className   = 'value ' + pnlClass(totalUnrl);
  document.getElementById('sum-trades').textContent     = totalPos;
}

function updatePnlSummary(data) {
  const el = document.getElementById('sum-realized');
  el.textContent = pnlSign(data.totalPnl) + '$' + fmt(data.totalPnl);
  el.className   = 'value ' + pnlClass(data.totalPnl);
  const lbl = { today:'Today', yesterday:'Yesterday', '7d':'Last 7 Days',
    this_week:'This Week', last_week:'Last Week', this_month:'This Month',
    last_month:'Last Month', '3m':'Last 3 Months', all:'All Time' };
  document.getElementById('period-label').textContent = lbl[data.period] || data.period;
}

function updateAccountPnl(pnlAccounts) {
  pnlAccounts.forEach(p => {
    const el = document.getElementById(`pnl-${p.id}`);
    if (el) {
      el.textContent = pnlSign(p.netPnl) + '$' + fmt(p.netPnl);
      el.className   = 'pl ' + pnlClass(p.netPnl);
    }
    const fl = document.getElementById(`fills-${p.id}`);
    if (fl) fl.textContent = `${p.fillCount} fills`;
  });
}

function renderAccounts(accounts) {
  const grid = document.getElementById('accounts-grid');
  grid.innerHTML = '';
  accounts.forEach(acc => {
    const card = document.createElement('div');
    card.className = 'account-card';
    card.innerHTML = `
      <div class="account-header">
        <div class="name">Account ${acc.id}: ${acc.name}</div>
        <div class="badge">DELTA</div>
      </div>
      ${acc.error ? `<div class="error-banner">API Error: ${acc.error}</div>` : ''}
      <div class="account-stats">
        <div class="stat-cell">
          <div class="s-label">Net Equity</div>
          <div class="s-value">$${fmt(acc.balance)}</div>
        </div>
        <div class="stat-cell">
          <div class="s-label">Available</div>
          <div class="s-value">$${fmt(acc.available)}</div>
        </div>
        <div class="stat-cell">
          <div class="s-label">Unrealized PnL</div>
          <div class="s-value ${pnlClass(acc.unrealizedPnl)}">${pnlSign(acc.unrealizedPnl)}$${fmt(acc.unrealizedPnl)}</div>
        </div>
      </div>

      <!-- Open Positions -->
      <div class="section-title">
        <span>Current Trades (Positions)</span>
        <span class="count">${acc.positions?.length || 0}</span>
      </div>
      ${renderPositions(acc.positions)}

      <!-- Open Orders -->
      <div class="section-title">
        <span>Open Orders</span>
        <span class="count">${acc.openOrders?.length || 0}</span>
      </div>
      ${renderOrders(acc.openOrders, false)}

      <!-- Stop Orders -->
      <div class="section-title">
        <span>Stop Orders</span>
        <span class="count">${acc.stopOrders?.length || 0}</span>
      </div>
      ${renderOrders(acc.stopOrders, true)}

      <!-- Period PnL -->
      <div class="account-pnl-row">
        <span style="color:var(--muted)">Period PnL</span>
        <div style="display:flex;gap:12px;align-items:center">
          <span style="color:var(--muted);font-size:11px" id="fills-${acc.id}">–</span>
          <span class="pl" id="pnl-${acc.id}">–</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function renderPositions(positions) {
  if (!positions || !positions.length) return '<div class="empty-row">No open positions</div>';
  return `<table class="trades-table">
    <thead><tr>
      <th>Symbol</th><th>Side</th><th>Size</th>
      <th>Entry</th><th>Mark</th><th>Unrealized PnL</th><th>Liq. Price</th>
    </tr></thead>
    <tbody>
    ${positions.map(p => `<tr>
      <td>${p.symbol}</td>
      <td class="${p.side === 'long' ? 'side-long' : 'side-short'}">${p.side.toUpperCase()}</td>
      <td>${fmt(p.size, 4)}</td>
      <td>$${fmt(p.entryPrice)}</td>
      <td>$${fmt(p.markPrice)}</td>
      <td class="${pnlClass(p.unrealizedPnl)}">${pnlSign(p.unrealizedPnl)}$${fmt(p.unrealizedPnl)}</td>
      <td>${p.liquidationPx ? '$' + fmt(p.liquidationPx) : '–'}</td>
    </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderOrders(orders, isStop) {
  if (!orders || !orders.length) return `<div class="empty-row">No ${isStop ? 'stop' : 'open'} orders</div>`;
  return `<table class="trades-table">
    <thead><tr>
      <th>Symbol</th><th>Side</th><th>Size</th>
      <th>${isStop ? 'Stop Price' : 'Limit Price'}</th>
      <th>Type</th><th>Time</th>
    </tr></thead>
    <tbody>
    ${orders.map(o => `<tr>
      <td>${o.symbol}</td>
      <td class="${o.side === 'buy' ? 'side-long' : 'side-short'}">${o.side.toUpperCase()}</td>
      <td>${fmt(o.size, 0)}</td>
      <td>$${fmt(isStop ? o.stopPrice : o.price)}</td>
      <td style="color:var(--muted)">${(isStop ? o.type : o.type || '').replace(/_/g,' ')}</td>
      <td style="color:var(--muted)">${o.created_at ? new Date(o.created_at).toLocaleString() : '–'}</td>
    </tr>`).join('')}
    </tbody>
  </table>`;
}

function setLoading(v) {
  document.getElementById('loading').style.display = v ? 'flex' : 'none';
}
</script>
</body>
</html>
